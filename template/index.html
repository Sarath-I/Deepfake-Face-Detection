<!DOCTYPE html>
<html>
<head>
    <title>Deepfake Detection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 400px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
        }

        h2 {
            margin-bottom: 20px;
        }

        input[type="file"] {
            margin: 15px 0;
        }

        button {
            background-color: #00c6ff;
            border: none;
            padding: 10px 20px;
            color: black;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #00a2cc;
        }

        img {
            margin-top: 15px;
            border-radius: 10px;
            max-width: 100%;
        }

        .result {
            margin-top: 20px;
            padding: 10px;
            border-radius: 10px;
            background-color: rgba(255,255,255,0.1);
        }

        .real {
            color: #00ff9d;
            font-weight: bold;
        }

        .fake {
            color: #ff4d4d;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Deepfake Image Detection</h2>

    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required><br>
        <button type="submit">Predict</button>
    </form>

    {% if img_path %}
        <img src="{{ img_path }}">
    {% endif %}

    {% if label %}
        <div class="result">
            <h3 class="{{ label|lower }}">Prediction: {{ label }}</h3>
            <p>Confidence: {{ confidence }}</p>
        </div>
    {% endif %}

</div>

</body>
</html>
